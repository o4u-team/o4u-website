[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "apps/api"]
resolver = "2"
[workspace.package]
edition = "2024"
rust-version = "1.94"
[workspace.dependencies]
o4u-domain = { path = "crates/domain" }
o4u-application = { path = "crates/application" }
o4u-infrastructure = { path = "crates/infrastructure" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "uuid", "chrono"] }
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
